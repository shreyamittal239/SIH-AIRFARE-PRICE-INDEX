services:
  postgres:
    image: postgres:16-alpine
    container_name: sih_airfare_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-airfare_index}
      POSTGRES_USER: ${POSTGRES_USER:-airfare_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airfare_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airfare_user} -d ${POSTGRES_DB:-airfare_index}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
    name: sih_airfare_postgres_data
